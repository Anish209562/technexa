name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deploy job publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turn Pages on (source: GitHub Actions) if it is not enabled yet.
          enablement: true

      - name: Build
        env:
          # Project pages live under /<repo>/, so assets and routes need that prefix.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute canonical links, Open Graph URLs and the sitemap.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
